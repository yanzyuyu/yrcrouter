<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2508 254" width="2508" height="254">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>
  <style>
    .terminal-text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #c9d1d9; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; font-weight: 500; }
    .prompt { fill: #58a6ff; font-weight: bold; }
    .cmd-text { fill: #f0f6fc; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="2508" height="254" rx="10" fill="url(#bg_grad)" stroke="#30363d" stroke-width="1.5" />
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />
  <text x="1254.0" y="24" text-anchor="middle" class="title-text">yrcrouter — terminal execution</text>
  <line x1="0" y1="38" x2="2508" y2="38" stroke="#30363d" stroke-width="1" />
  <text x="24" y="56" class="terminal-text"><tspan class="prompt">$ </tspan><tspan class="cmd-text">bash -c ./yrcrouter &amp; PID=$!; sleep 1; curl -s http://127.0.0.1:20128/v1/models | head -c 160; echo &#x27;&#x27;; kill $PID; wait $PID 2&gt;/dev/null || true</tspan></text>
  <text x="24" y="78" class="terminal-text"><tspan>[ROUTER] listening on http://127.0.0.1:20128</tspan></text>
  <text x="24" y="98" class="terminal-text"><tspan>[ROUTER] v1 endpoint: http://127.0.0.1:20128/v1/chat/completions</tspan></text>
  <text x="24" y="118" class="terminal-text"><tspan>[ROUTER] dashboard:   http://127.0.0.1:20128</tspan></text>
  <text x="24" y="138" class="terminal-text"><tspan>{&quot;object&quot;:&quot;list&quot;,&quot;data&quot;:[{&quot;id&quot;:&quot;openrouter/auto&quot;,&quot;object&quot;:&quot;model&quot;,&quot;created&quot;:1792828825,&quot;owned_by&quot;:&quot;openrouter&quot;},{&quot;id&quot;:&quot;google/gemini-2.5-flash&quot;,&quot;object&quot;:&quot;model&quot;</tspan></text>
  <text x="24" y="158" class="terminal-text"></text>
  <text x="24" y="178" class="terminal-text"><tspan>[ROUTER] shutting down gracefully...</tspan></text>
  <text x="24" y="198" class="terminal-text"><tspan>[ROUTER] stopped</tspan></text>
  <text x="24" y="218" class="terminal-text"></text>
</svg>
